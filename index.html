<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c4956a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="BigBrain — A minimal, elegant personal progress tracker. Track your study sessions, journal, notes, projects, health, and progress. Everything stored locally." />
    <title>BigBrain — Personal Progress Tracker</title>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading BigBrain">
      <div class="boot-loader-core"><span></span><i></i></div>
      <div class="boot-loader-label">TUNING YOUR FOCUS</div>
    </div>
    <style>
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #fbfaf8; color: #8d8178; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; transition: opacity .25s ease; }
      .boot-loader-core { position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(196,149,106,.35); border-radius: 999px; box-shadow: 0 0 0 8px rgba(196,149,106,.08); }
      .boot-loader-core i { width: 44px; height: 44px; border: 1px dashed rgba(196,149,106,.6); border-radius: 999px; animation: boot-spin 1.2s linear infinite; }
      .boot-loader-core span { position: absolute; width: 10px; height: 10px; border-radius: 999px; background: #c4956a; box-shadow: 0 0 18px rgba(196,149,106,.85); }
      .boot-loader-label { font-size: 11px; letter-spacing: .28em; }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
